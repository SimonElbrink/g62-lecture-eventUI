<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<header class="fixed inset-x-0 top-0 z-50 border-b border-white/5 bg-slate-900/95 shadow-lg shadow-black/20 backdrop-blur">
    <!-- CSS-only toggle for the mobile menu -->
    <input type="checkbox" id="nav-toggle" class="peer sr-only">

    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6 lg:px-8">
        <!-- Logo -->
        <a href="#" class="group flex items-center gap-3">
            <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-600 shadow-md shadow-red-600/30 transition-colors duration-200 group-hover:bg-red-700">
                <svg class="h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="16" rx="2"/>
                    <path stroke-linecap="round" d="M3 10h18M8 3v4M16 3v4"/>
                    <path stroke-linecap="round" d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01"/>
                </svg>
            </span>
            <span class="text-lg font-semibold tracking-tight text-white">Event App</span>
        </a>

        <!-- Desktop navigation -->
        <nav class="hidden md:flex md:items-center md:gap-1" aria-label="Main">
            <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-white transition-colors duration-200 hover:bg-white/5">Home</a>
            <a href="#about" class="rounded-md px-3 py-2 text-sm font-medium text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white">About</a>
            <a href="#features" class="rounded-md px-3 py-2 text-sm font-medium text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white">Features</a>
            <a href="#contact" class="rounded-md px-3 py-2 text-sm font-medium text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white">Contact</a>
        </nav>

        <!-- Actions -->
        <div class="flex items-center gap-2">
            <a href="#signin" class="hidden rounded-md px-3 py-2 text-sm font-medium text-slate-300 transition-colors duration-200 hover:text-white sm:inline-block">Sign In</a>
            <a href="#get-started" class="hidden rounded-full bg-red-600 px-5 py-2 text-sm font-semibold text-white shadow-md shadow-red-600/25 transition-all duration-200 hover:-translate-y-px hover:bg-red-700 hover:shadow-lg hover:shadow-red-700/30 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900 sm:inline-block">
                Get Started
            </a>

            <!-- Mobile menu button -->
            <label for="nav-toggle" class="inline-flex cursor-pointer items-center justify-center rounded-md p-2 text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white md:hidden" aria-label="Toggle navigation">
                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </label>
        </div>
    </div>

    <!-- Mobile navigation -->
    <nav class="hidden border-t border-white/5 px-6 pb-4 pt-2 peer-checked:block md:hidden" aria-label="Mobile">
        <a href="#" class="block rounded-md px-3 py-2 text-base font-medium text-white hover:bg-white/5">Home</a>
        <a href="#about" class="block rounded-md px-3 py-2 text-base font-medium text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white">About</a>
        <a href="#features" class="block rounded-md px-3 py-2 text-base font-medium text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white">Features</a>
        <a href="#contact" class="block rounded-md px-3 py-2 text-base font-medium text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white">Contact</a>
        <div class="mt-3 flex flex-col gap-2 border-t border-white/5 pt-3">
            <a href="#signin" class="rounded-md px-3 py-2 text-base font-medium text-slate-300 transition-colors duration-200 hover:bg-white/5 hover:text-white">Sign In</a>
            <a href="#get-started" class="rounded-full bg-red-600 px-5 py-2.5 text-center text-sm font-semibold text-white shadow-md shadow-red-600/25 transition-colors duration-200 hover:bg-red-700">Get Started</a>
        </div>
    </nav>
</header>


</body>
</html>
